name: Run Postman Tests

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

jobs:
    postman-tests:
        runs-on: ubuntu-latest

        steps:
            # 1. Checkout your repository
            - name: Checkout repository
              uses: actions/checkout@v3

            # 2. Set up Node.js (needed for Newman)
            - name: Set up Node.js
              uses: actions/setup-node@v3
              with:
                  node-version: "18"

            # 3. Install Newman
            - name: Install Newman
              run: npm install -g newman

            # 4. Run E2E Tests
            - name: Run Grocery Store API E2E Tests
              run: |
                  newman run "collections/Grocery Store API End-to-End Tests.postman_collection.json" \
                    --folder "E2E Tests" \
                    -e "envs/stage.postman_environment.json"

            # 5. Run Data-Driven Product Tests (Products folder only)
            - name: Run Grocery Store API Data-Driven Product Tests (Products folder)
              run: |
                  newman run "collections/Grocery Store API DataDriven Tests.postman_collection.json" \
                    --folder "Products" \
                    -d "data/products-test-data.json" \
                    -e "envs/stage.postman_environment.json"

            # 6. Run Full Data-Driven Tests (entire collection)
            - name: Run Grocery Store API Cart Data-Driven Tests
              run: |
                  newman run "collections/Grocery Store API DataDriven Tests.postman_collection.json" \
                    --folder "Carts" \
                    -d "data/carts-test-data.json" \
                    -e "envs/stage.postman_environment.json"
